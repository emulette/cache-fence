name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Consumer test
        run: npm run test:consumer

      - name: Test
        run: npm test

  # Every supported server image and client library, standalone and Cluster.
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        redis-image:
          - redis:7-alpine
          - redis:8-alpine
          - valkey/valkey:8-alpine
          - valkey/valkey:9-alpine
        redis-client: [node-redis, ioredis]
    env:
      REDIS_IMAGE: ${{ matrix.redis-image }}
      REDIS_CLIENT: ${{ matrix.redis-client }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Standalone tests
        run: npm test

      - name: Cluster tests
        run: npm run test:cluster
